spring.application.name=low-carbon-dormitory

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/lowcarbon}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lowcarbon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:000000}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=3000

app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:low-carbon-dormitory-token-secret}
app.auth.token-ttl-seconds=${APP_AUTH_TOKEN_TTL_SECONDS:86400}
app.upload.reward-dir=${APP_UPLOAD_REWARD_DIR:../storage/reward-images}
app.upload.reward-url-prefix=${APP_UPLOAD_REWARD_URL_PREFIX:/uploads/rewards}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
